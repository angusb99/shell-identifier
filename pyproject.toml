[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-identifier"
version = "0.1.0"
description = "Score addresses on a cadastral parcel for the likelihood that each is a 'shell' (parent/container) address."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "pyyaml>=6",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[project.scripts]
shell-identifier = "shell_identifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shell_identifier = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
